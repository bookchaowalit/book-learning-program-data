[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-learning-program-data"
version = "0.1.0"
description = "Find learning access and credentials by prerequisites and workload."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-learning-program-data = "book_learning_program_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_learning_program_data = ["*.json"]
